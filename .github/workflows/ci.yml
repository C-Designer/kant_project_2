name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check <github-id>/<type>-<description>
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          owner="$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')"
          pattern="^${owner}/(feat|fix|docs|refactor|test|chore)-[a-z0-9][a-z0-9-]*$"
          if [[ ! "$HEAD_REF" =~ $pattern ]]; then
            echo "::error::브랜치 이름 '$HEAD_REF' 이(가) 규칙과 다릅니다. 예: ${owner}/feat-share-panel (CONTRIBUTING.md 참고)"
            exit 1
          fi
          echo "OK: $HEAD_REF"

  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # dev 그룹만 설치해 torch 등 무거운 런타임 의존성을 받지 않는다.
      - run: uv sync --frozen --only-group dev
      - run: uv run --no-sync ruff check backend tests scripts

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
