[project]
name = "lovecode-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.1", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "lunar-python>=1.4,<2",
  "joblib>=1.4,<2", "tzdata>=2024.1", "torch==2.9.1+cpu",
  "transformers==5.19.0", "safetensors>=0.5,<1", "langchain-openai>=0.3,<2"
]

[tool.uv.sources]
torch = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
