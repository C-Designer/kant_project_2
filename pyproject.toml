[project]
name = "lovecode"
version = "0.1.0"
description = "Local-first relationship style MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "lunar-python>=1.4,<2",
  "scikit-learn>=1.6,<2",
  "sentence-transformers>=3,<6",
  "joblib>=1.4,<2",
  "tzdata>=2024.1",
  "torch>=2.7",
  "transformers>=4.46,<6",
  "langchain-core>=0.3,<2",
  "langchain-ollama>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "catboost>=1.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "korean-lunar-calendar>=0.3,<1"]

# RTX 50xx(Blackwell) needs CUDA 12.8 wheels; macOS keeps the default PyPI build.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/lovecode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
