[project]
name = "lovecode"
version = "0.1.0"
description = "Local-first relationship style MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "lunar-python>=1.4,<2",
  "korean-lunar-calendar>=0.3,<1",
  "scikit-learn>=1.6,<2",
  "sentence-transformers>=3,<6",
  "langchain-core>=0.3,<2",
  "joblib>=1.4,<2",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/lovecode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
